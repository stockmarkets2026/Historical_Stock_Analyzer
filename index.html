    <script>
      // Suppress benign third-party browser extension errors (e.g. MetaMask/Web3 wallet inpage injection)
      (function() {
        function isExtensionError(msg, src, stack) {
          var str = ((msg || '') + ' ' + (src || '') + ' ' + (stack || '')).toLowerCase();
          return (
            str.indexOf('metamask') !== -1 ||
            str.indexOf('nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1 ||
            str.indexOf('chrome-extension://') !== -1 ||
            str.indexOf('moz-extension://') !== -1 ||
            str.indexOf('inpage.js') !== -1 ||
            str.indexOf('failed to connect to metamask') !== -1
          );
        }

        window.addEventListener(
          'unhandledrejection',
          function(e) {
            var reason = e ? e.reason : null;
            var msg = reason ? (reason.message || reason) : '';
            var stack = reason ? reason.stack : '';
            if (isExtensionError(msg, '', stack)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );

        window.addEventListener(
          'error',
          function(e) {
            var msg = e ? e.message : '';
            var filename = e ? e.filename : '';
            var stack = e && e.error ? e.error.stack : '';
            if (isExtensionError(msg, filename, stack)) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return true;
            }
          },
          true
        );
      })();
    </script>
